# Build and publish the chatwoot-sm (fork) Docker image, then create a GitHub Release.
# Does not replace upstream publish_*_docker workflows — those remain untouched.
#
# Triggered by annotated tags created via ./scripts/release_git.sh

name: Release chatwoot-sm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing git tag to build/publish (e.g. v4.16.2.d)'
        required: true
        type: string

env:
  DOCKER_REPO: sidneynma/chatwoot-sm
  RELEASE_EDITION: ee

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid version: $VERSION (expected e.g. v4.16.2.d)"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.DOCKER_REPO }}:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.version }}
          fetch-depth: 0

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="${{ env.RELEASE_EDITION }}"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=chatwoot-sm-amd64
          cache-to: type=gha,mode=max,scope=chatwoot-sm-amd64

      - name: Extract changelog notes
        id: notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES_FILE="${{ runner.temp }}/release-notes.md"
          if [ ! -f CHANGELOG.md ]; then
            echo "Release ${VERSION}" > "$NOTES_FILE"
          else
            # Section between ## [VERSION] and the next ## [
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" {capture=1; next}
              capture && $0 ~ /^## \[/ {exit}
              capture {print}
            ' CHANGELOG.md > "$NOTES_FILE"
            if [ ! -s "$NOTES_FILE" ]; then
              echo "Release ${VERSION}" > "$NOTES_FILE"
            fi
          fi
          {
            echo ""
            echo "### Docker"
            echo ""
            echo '```yaml'
            echo "image: ${{ steps.meta.outputs.image }}"
            echo '```'
          } >> "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          prerelease: false
          generate_release_notes: false
